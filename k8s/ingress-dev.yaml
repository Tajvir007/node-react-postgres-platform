apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: ingress-dev
  namespace: dev

spec:
  # Tell the NGINX Ingress Controller to handle this Ingress
  ingressClassName: nginx

  rules:
    - host: node-react.local
      http:
        paths:
          # Send API requests to the backend Service
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 3000

          # Send all other requests to the frontend Service
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80