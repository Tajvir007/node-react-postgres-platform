apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensearch
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opensearch
  template:
    metadata:
      labels:
        app: opensearch
    spec:
      containers:
        - name: opensearch
          image: opensearchproject/opensearch:2
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 9200

          env:
            # Run as a single-node cluster
            - name: discovery.type
              value: "single-node"

            # Local assessment only; do not use this in production
            - name: DISABLE_SECURITY_PLUGIN
              value: "true"

            # Limit Java heap memory
            - name: OPENSEARCH_JAVA_OPTS
              value: "-Xms512m -Xmx512m"

          resources:
            requests:
              cpu: "250m"
              memory: "768Mi"
            limits:
              cpu: "1000m"
              memory: "1536Mi"

          # Allow OpenSearch enough time to start
          startupProbe:
            httpGet:
              path: /_cluster/health
              port: 9200
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30

          # Send traffic only when OpenSearch is ready
          readinessProbe:
            httpGet:
              path: /_cluster/health
              port: 9200
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: opensearch
  namespace: dev
spec:
  type: ClusterIP
  selector:
    app: opensearch
  ports:
    - name: http
      port: 9200
      targetPort: 9200